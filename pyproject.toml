[project]
name = "verifierlock"
version = "0.1.0"
description = "VerifierLock: detects whether a Git change has independent test evidence or weakened its own verifier."
readme = "DECISIONS.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "coverage>=7.0.0",
]

[project.scripts]
verifierlock = "verifierlock.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["verifierlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
